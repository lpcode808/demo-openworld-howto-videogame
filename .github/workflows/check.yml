name: Teaching artifact checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/check.mjs
      - run: node tools/check-doc-lines.mjs
      - run: node tools/playthrough.mjs
      - run: node tools/check-xray-removable.mjs

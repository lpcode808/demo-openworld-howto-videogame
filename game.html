<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open World How-To</title>
<style>
  /* The page is a dark frame around one canvas. Everything you see in the
     game is drawn onto that canvas by the JavaScript below. */
  body {
    margin: 0;
    background: #101018;
    color: #ddd;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    margin-top: 16px;
    background: #000;
    image-rendering: pixelated;
  }
  p {
    max-width: 640px;
    font-size: 13px;
    color: #888;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<p>
  Arrow keys or WASD to walk. Space to talk and to pick a dialogue choice.
  K saves, L loads, N starts over. Open this file in a text editor to see how it works.
</p>
<script>
'use strict';

/* ============================================================
   1 · CONFIG — every number you might want to change
   What to look for: nothing further down the file is a bare
   number. Speed, sizes, colors and timings all live here, so
   changing how the game feels never means hunting through logic.
   ============================================================ */

// The world is a grid of square tiles. Everything is measured in tiles
// and converted to pixels only at draw time.
const tileSizeInPixels = 32;
const viewportWidthInTiles = 20;
const viewportHeightInTiles = 15;

// How fast the player walks: steps (tiles) per second while a key is held.
const playerStepsPerSecond = 7;

// The simulation advances in fixed slices so that a slow or fast computer
// produces exactly the same game. 1/60 means sixty updates per second.
const fixedStepInSeconds = 1 / 60;

// If the browser tab was hidden, a huge gap of time can pile up. We never
// simulate more than this much at once so the game doesn't "fast forward".
const maxFrameGapInSeconds = 0.25;

// How long the yellow notice ("Saved!", "Picked up ...") stays on screen.
const noticeDurationInSeconds = 2;

// The strip under the world where the bag and quest list are drawn.
const hudHeightInPixels = 96;

// The name of the slot in the browser's localStorage that holds the save.
const saveSlotName = 'open-world-how-to-save';

// When true, every frame checks that RENDER did not change state.
// It costs a little speed and is worth it: it proves the file's big promise.
const checkRenderPurity = true;

const colors = {
  grass: '#5cab4a',
  path: '#c9b47c',
  tree: '#2f6b31',
  treeTop: '#1f4a22',
  water: '#3a7bd5',
  bridge: '#9c6b3c',
  door: '#7a4a1e',
  doorInner: '#3d2410',
  wall: '#6d6d7a',
  floor: '#b08a5a',
  outsideMap: '#000000',
  player: '#f2d16b',
  playerEye: '#222222',
  hudBackground: '#15151f',
  hudText: '#eeeeee',
  hudDim: '#8a8a99',
  questDone: '#7be07b',
  notice: '#ffd75e',
  dialogueBox: 'rgba(10, 10, 20, 0.92)',
  dialogueName: '#ffd75e',
  dialogueText: '#ffffff',
  dialogueChoice: '#bbbbbb',
  dialogueChoiceSelected: '#ffd75e',
};

const fonts = {
  hud: '15px monospace',
  small: '11px monospace',
  dialogue: '16px monospace',
  notice: 'bold 18px monospace',
};


/* ============================================================
   2 · DATA — the world, written out as plain data
   What to look for: the map is a list of strings you can edit by
   typing. Items, characters, dialogue and quests are tables. None
   of this section runs; it is just facts the rest of the file reads.
   ============================================================ */

// Each character in a map string is one tile. This table says what each
// character means. Add a row here and you can type the new tile into a map.
// The bridge is listed as NOT walkable: COLLIDE makes an exception for it
// once the carpenter has fixed it. That one rule is the whole quest system.
const tileTypes = {
  '.': { name: 'grass',  color: colors.grass,  walkable: true  },
  '=': { name: 'path',   color: colors.path,   walkable: true  },
  'T': { name: 'tree',   color: colors.tree,   walkable: false },
  '~': { name: 'water',  color: colors.water,  walkable: false },
  'B': { name: 'bridge', color: colors.water,  walkable: false },
  'D': { name: 'door',   color: colors.door,   walkable: true  },
  '#': { name: 'wall',   color: colors.wall,   walkable: false },
  '_': { name: 'floor',  color: colors.floor,  walkable: true  },
  'X': { name: 'exit',   color: colors.door,   walkable: true  },
};

// Two maps make a world. Each one is just a list of equal-length strings.
// Row 0 is the top of the map; character 0 of a row is its left edge.
const maps = {
  overworld: {
    title: 'Riverside',
    rows: [
      'TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT',  // 0
      'T.........................~~...........T',  // 1
      'T.........................~~........T..T',  // 2
      'T....T..~~~~~..TT.........~~..TT.......T',  // 3
      'T.......~~~~~..T......TT..~~...........T',  // 4
      'T.......~~~~~.............~~...........T',  // 5
      'T.......~~~~~.............~~..#######..T',  // 6
      'T.........................~~..#######..T',  // 7
      'T...................TT....~~..#######..T',  // 8
      'T..TT................T....~~..#######..T',  // 9
      'T.........T...............~~..###D###..T',  // 10
      'T.........................~~.....=.....T',  // 11
      'T................T........~~.....=.....T',  // 12
      'T.........................~~.....=.....T',  // 13
      'T.========================BB======.....T',  // 14
      'T.........................~~........TT.T',  // 15
      'T.........................~~........T..T',  // 16
      'T............T....TT......~~...........T',  // 17
      'T.........................~~...........T',  // 18
      'T...TTTT.TTTT.............~~...........T',  // 19
      'T...TTTT.TTTT.............~~..TT.TT..T.T',  // 20
      'T...TT.....TT.............~~..T...T....T',  // 21
      'T...TT.....TT.....TT......~~..T...T....T',  // 22
      'T...TT.....TT.............~~..T...T....T',  // 23
      'T...TTTTTTTTT.............~~..TTTTT....T',  // 24
      'T...TTTTTTTTT.........TT..~~...........T',  // 25
      'T......................T..~~..T....T...T',  // 26
      'T......T......T...........~~...T.......T',  // 27
      'T.........................~~...........T',  // 28
      'TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT',  // 29
    ],
  },
  house: {
    title: "Oswin's House",
    rows: [
      '####################',  // 0
      '#__________________#',  // 1
      '#__________________#',  // 2
      '#__________________#',  // 3
      '#_____________##___#',  // 4
      '#_____________##___#',  // 5
      '#__________________#',  // 6
      '#__________________#',  // 7
      '#__________________#',  // 8
      '#__________________#',  // 9
      '#__________________#',  // 10
      '#__________________#',  // 11
      '#__________________#',  // 12
      '##########X#########',  // 13
      '####################',  // 14
    ],
  },
};

// Doors connect a tile on one map to a tile on another. When the player
// steps onto the "from" tile, UPDATE moves them to the "to" tile.
const doors = [
  {
    fromMap: 'overworld', fromX: 33, fromY: 10,
    toMap: 'house', toX: 10, toY: 12, facing: 'up',
  },
  {
    fromMap: 'house', fromX: 10, fromY: 13,
    toMap: 'overworld', toX: 33, toY: 11, facing: 'down',
  },
];

// Which way each facing direction moves you, in tiles.
const directionOffsets = {
  up:    { dx: 0,  dy: -1 },
  down:  { dx: 0,  dy: 1  },
  left:  { dx: -1, dy: 0  },
  right: { dx: 1,  dy: 0  },
};

// Things lying on the ground. Walk over one to pick it up.
const items = [
  { id: 'herb',    name: 'Healing Herb', map: 'overworld', tileX: 8,  tileY: 22, color: '#7fe36b' },
  { id: 'plank',   name: 'Wooden Plank', map: 'overworld', tileX: 20, tileY: 25, color: '#c98a4b' },
  { id: 'lantern', name: 'Lantern',      map: 'overworld', tileX: 32, tileY: 22, color: '#ffb347' },
  { id: 'crown',   name: 'Gold Crown',   map: 'house',     tileX: 3,  tileY: 2,  color: '#ffe14d' },
];

// The three quests. Each is a flag in state.flags that starts false.
// The HUD lists these; the NPCs below are what flip them.
const quests = [
  { flag: 'healerHelped', title: 'Bring Mira a healing herb' },
  { flag: 'bridgeBuilt',  title: 'Bring Bram a wooden plank' },
  { flag: 'elderLit',     title: 'Bring Oswin his lantern' },
];

// People to talk to. Each one wants an item; giving it sets a flag.
// Dialogue is a set of named nodes. A node shows lines of text and offers
// choices; each choice names the next node, or null to stop talking.
// Trees are at most two nodes deep on purpose: easy to read, easy to extend.
// UPDATE picks the starting node: 'afterQuest' if the flag is already set,
// 'offer' if you are carrying what they want, otherwise 'hello'.
const npcs = [
  {
    id: 'mira',
    name: 'Mira the Healer',
    map: 'overworld',
    tileX: 6,
    tileY: 13,
    color: '#e56b9f',
    wantsItem: 'herb',
    setsFlag: 'healerHelped',
    dialogue: {
      hello: {
        lines: ["Oh, hello. I'm Mira, the village healer.",
                'A child down the lane has a fever and my basket is empty.'],
        choices: [{ label: 'Where do herbs grow?', next: 'more' },
                  { label: "I'll be back.", next: null }],
      },
      more: {
        lines: ['Healing herbs grow in the tree grove to the south-west.',
                'Look for a gap in the trees on its north side.'],
        choices: [],
      },
      offer: {
        lines: ['Is that a healing herb in your bag?', 'Please, may I have it?'],
        choices: [{ label: 'Give her the herb', next: 'thanks', givesItem: 'herb' },
                  { label: 'Not right now', next: null }],
      },
      thanks: {
        lines: ['Thank you! The child will be well by morning.'],
        choices: [],
      },
      afterQuest: {
        lines: ["The fever broke. You're a hero around here, you know."],
        choices: [],
      },
    },
  },
  {
    id: 'bram',
    name: 'Bram the Carpenter',
    map: 'overworld',
    tileX: 24,
    tileY: 13,
    color: '#5b8dd6',
    wantsItem: 'plank',
    setsFlag: 'bridgeBuilt',
    dialogue: {
      hello: {
        lines: ["Name's Bram. I'd fix that bridge if I had one good plank.",
                "The river's been cutting the village in half for weeks."],
        choices: [{ label: 'Where can I find a plank?', next: 'more' },
                  { label: 'Good luck.', next: null }],
      },
      more: {
        lines: ["There's one lying by the trees to the south, I think.",
                "Bring it and I'll have the bridge up in no time."],
        choices: [],
      },
      offer: {
        lines: ['That plank is exactly what I need!'],
        choices: [{ label: 'Hand over the plank', next: 'thanks', givesItem: 'plank' },
                  { label: 'Keep it', next: null }],
      },
      thanks: {
        lines: ['Watch this... done! The bridge is open. Go on across.'],
        choices: [],
      },
      afterQuest: {
        lines: ["Sturdy bridge, isn't it? Best work I've done."],
        choices: [],
      },
    },
  },
  {
    id: 'oswin',
    name: 'Oswin the Elder',
    map: 'house',
    tileX: 10,
    tileY: 4,
    color: '#b9a7e0',
    wantsItem: 'lantern',
    setsFlag: 'elderLit',
    dialogue: {
      hello: {
        lines: ["Who's there? I can barely see you in this dark house.",
                'My lantern went out days ago.'],
        choices: [{ label: "Where's your lantern?", next: 'more' },
                  { label: "I'll go look.", next: null }],
      },
      more: {
        lines: ['I dropped it in the little wood south of my house.',
                "These old legs won't carry me there."],
        choices: [],
      },
      offer: {
        lines: ['Is that my lantern? Light it, please!'],
        choices: [{ label: 'Give him the lantern', next: 'thanks', givesItem: 'lantern' },
                  { label: 'Not yet', next: null }],
      },
      thanks: {
        lines: ['Ah, light! Take the old crown on the shelf as thanks.',
                "It's been gathering dust for fifty years."],
        choices: [],
      },
      afterQuest: {
        lines: ['Thanks to you I can read again. Come visit anytime.'],
        choices: [],
      },
    },
  },
];

// Two lookups into the tables above, used by UPDATE and RENDER alike.
function findItemById(itemId) {
  for (const item of items) {
    if (item.id === itemId) return item;
  }
  return null;
}

function findNpcById(npcId) {
  for (const npc of npcs) {
    if (npc.id === npcId) return npc;
  }
  return null;
}


/* ============================================================
   3 · STATE — the one object that remembers everything
   What to look for: there is exactly one `state`. If the game
   "knows" something (where you are, what you carry, what you've
   done), it is a field in here. Nowhere else.
   ============================================================ */

// This is the single source of truth. Every fact about the world that can
// change lives in this one object, so there is nowhere for a bug to hide.
//
// Only two other things in the file change at runtime, and neither is
// game knowledge: `intents` in INPUT (a mailbox from the keyboard) and the
// stopwatch inside LOOP (how much time has passed). Neither is saved and
// neither is drawn.
const state = {
  // Which entry in `maps` we are standing in.
  currentMap: 'overworld',

  player: {
    tileX: 3,
    tileY: 14,
    facing: 'right',
    // Seconds until the player may take the next step. Counts down in UPDATE.
    stepCooldown: 0,
  },

  // Item ids in the order picked up, e.g. ['herb', 'plank'].
  inventory: [],

  // Item ids that have ever been picked up, so they don't reappear on the
  // ground after being given away. e.g. { herb: true }.
  pickedUpItems: {},

  // The quest flags. false until the matching NPC receives their item.
  flags: {
    healerHelped: false,
    bridgeBuilt: false,
    elderLit: false,
  },

  // null when nobody is talking. Otherwise which NPC, which dialogue node,
  // and which choice is highlighted.
  dialogue: null,

  // The short yellow message at the top of the screen.
  notice: {
    text: '',
    secondsLeft: 0,
  },
};


/* ============================================================
   4 · INPUT — keyboard events become intents
   What to look for: this section never moves the player. It only
   records what the player is asking for. UPDATE decides whether
   to grant it.
   ============================================================ */

// The mailbox between the keyboard and UPDATE. Two kinds of field:
//  - "move*" are true for as long as the key is held down.
//  - "*Pressed" are true from the moment a key goes down until UPDATE has
//    read them once. That is how one tap of Space means one action.
const intents = {
  moveUp: false,
  moveDown: false,
  moveLeft: false,
  moveRight: false,
  interactPressed: false,
  menuUpPressed: false,
  menuDownPressed: false,
  savePressed: false,
  loadPressed: false,
  newGamePressed: false,
};

// Arrow keys and WASD do the same thing. `isDown` is true on keydown and
// false on keyup, so this one function handles both events.
function setMovementIntent(key, isDown) {
  if (key === 'arrowup' || key === 'w') intents.moveUp = isDown;
  if (key === 'arrowdown' || key === 's') intents.moveDown = isDown;
  if (key === 'arrowleft' || key === 'a') intents.moveLeft = isDown;
  if (key === 'arrowright' || key === 'd') intents.moveRight = isDown;
}

function onKeyDown(event) {
  // Lower-case so Shift+W still counts as W.
  const key = event.key.toLowerCase();
  const isGameKey = key.startsWith('arrow') || key === ' ' || 'wasdkln'.includes(key);
  if (isGameKey) {
    // Stop arrows and Space from scrolling the page underneath the game.
    event.preventDefault();
  }
  // Holding a key makes the browser fire keydown over and over. Movement
  // is handled by keyup anyway, and a held Space must not repeat, so we
  // record the movement and ignore everything else about a repeat.
  setMovementIntent(key, true);
  if (event.repeat) return;

  if (key === ' ') intents.interactPressed = true;
  if (key === 'arrowup' || key === 'w') intents.menuUpPressed = true;
  if (key === 'arrowdown' || key === 's') intents.menuDownPressed = true;
  if (key === 'k') intents.savePressed = true;
  if (key === 'l') intents.loadPressed = true;
  if (key === 'n') intents.newGamePressed = true;
}

function onKeyUp(event) {
  const key = event.key.toLowerCase();
  setMovementIntent(key, false);
}

// UPDATE calls this at the end of every step so a press counts once.
function clearPressedIntents() {
  intents.interactPressed = false;
  intents.menuUpPressed = false;
  intents.menuDownPressed = false;
  intents.savePressed = false;
  intents.loadPressed = false;
  intents.newGamePressed = false;
}


/* ============================================================
   5 · UPDATE — the rules of the world
   What to look for: this is the only place the world changes.
   Every function here reads intents and writes state, and does
   nothing else. If you want the game to behave differently,
   you change something in this section.
   ============================================================ */

// One fixed slice of game time. Read this top to bottom and you have the
// order of everything that can happen in the world.
function update(stepSeconds) {
  updatePlayerMovement(stepSeconds);
  clearPressedIntents();
}

// Walking is grid-based: the player is always on a whole tile and hops to
// the next one. The cooldown is what makes holding a key a steady walk
// instead of a blur.
function updatePlayerMovement(stepSeconds) {
  const player = state.player;
  player.stepCooldown -= stepSeconds;
  if (player.stepCooldown > 0) return;
  player.stepCooldown = 0;

  let wantedFacing = null;
  if (intents.moveUp) wantedFacing = 'up';
  else if (intents.moveDown) wantedFacing = 'down';
  else if (intents.moveLeft) wantedFacing = 'left';
  else if (intents.moveRight) wantedFacing = 'right';
  if (wantedFacing === null) return;

  // Turn first, so pressing a key toward a wall still faces you at it.
  player.facing = wantedFacing;
  const offset = directionOffsets[wantedFacing];
  const targetX = player.tileX + offset.dx;
  const targetY = player.tileY + offset.dy;
  if (!canWalkTo(state.currentMap, targetX, targetY)) return;

  player.tileX = targetX;
  player.tileY = targetY;
  player.stepCooldown = 1 / playerStepsPerSecond;
}


/* ============================================================
   6 · COLLIDE — what can you walk on, and where does it lead
   What to look for: tile lookups, the walkability rule, and doors
   between areas. Kept apart from UPDATE so you can read "why can't
   I walk through a tree?" on its own.
   ============================================================ */

// Which character is at this spot on this map? Off the map counts as a
// wall, so nobody can ever walk out of the world.
function tileAt(mapName, tileX, tileY) {
  const rows = maps[mapName].rows;
  if (tileY < 0 || tileY >= rows.length) return '#';
  if (tileX < 0 || tileX >= rows[tileY].length) return '#';
  return rows[tileY][tileX];
}

// The whole answer to "why can't I walk through a tree?" is here.
function canWalkTo(mapName, tileX, tileY) {
  const tileCharacter = tileAt(mapName, tileX, tileY);

  // The bridge is the one tile whose walkability depends on state.
  if (tileCharacter === 'B') {
    return state.flags.bridgeBuilt;
  }
  return tileTypes[tileCharacter].walkable;
}


/* ============================================================
   7 · RENDER — reads state, draws pixels, changes nothing
   What to look for: not one line in this section assigns to
   `state`. Drawing is a pure read. The loop checks that promise
   every frame (see the end of this section).
   ============================================================ */

// The canvas is the rectangle of pixels on the page. The "context" is the
// set of drawing commands (fillRect, fillText, arc...) for that canvas.
const canvas = document.getElementById('gameCanvas');
const context = canvas.getContext('2d');

// The camera is the top-left tile of the map that appears in the viewport.
// It follows the player and stops at the map edges so you never see past
// them. This function only calculates; it does not store anything.
function computeCamera() {
  const map = maps[state.currentMap];
  const mapWidthInTiles = map.rows[0].length;
  const mapHeightInTiles = map.rows.length;

  let cameraX = state.player.tileX - Math.floor(viewportWidthInTiles / 2);
  let cameraY = state.player.tileY - Math.floor(viewportHeightInTiles / 2);

  // Math.max(0, ...) handles a map smaller than the viewport, like the house.
  const furthestCameraX = Math.max(0, mapWidthInTiles - viewportWidthInTiles);
  const furthestCameraY = Math.max(0, mapHeightInTiles - viewportHeightInTiles);
  if (cameraX < 0) cameraX = 0;
  if (cameraY < 0) cameraY = 0;
  if (cameraX > furthestCameraX) cameraX = furthestCameraX;
  if (cameraY > furthestCameraY) cameraY = furthestCameraY;

  return { tileX: cameraX, tileY: cameraY };
}

// Draw one whole frame, back to front: ground, things on the ground,
// people, the player, then the flat interface panels on top.
function render() {
  const camera = computeCamera();
  drawTiles(camera);
  drawItems(camera);
  drawNpcs(camera);
  drawPlayer(camera);
  drawHud();
  if (state.dialogue !== null) {
    drawDialogueBox();
  }
  drawNotice();
}

// The bridge is the one tile whose look depends on state: water until the
// carpenter fixes it, planks afterwards.
function tileColorFor(tileCharacter) {
  if (tileCharacter === 'B' && state.flags.bridgeBuilt) {
    return colors.bridge;
  }
  return tileTypes[tileCharacter].color;
}

// Only the tiles inside the viewport are drawn. Tiles past the edge of a
// small map are painted black.
function drawTiles(camera) {
  const map = maps[state.currentMap];
  for (let screenRow = 0; screenRow < viewportHeightInTiles; screenRow++) {
    for (let screenCol = 0; screenCol < viewportWidthInTiles; screenCol++) {
      const mapX = camera.tileX + screenCol;
      const mapY = camera.tileY + screenRow;
      const pixelX = screenCol * tileSizeInPixels;
      const pixelY = screenRow * tileSizeInPixels;

      const isOutsideMap = mapY < 0 || mapY >= map.rows.length ||
        mapX < 0 || mapX >= map.rows[0].length;
      if (isOutsideMap) {
        context.fillStyle = colors.outsideMap;
        context.fillRect(pixelX, pixelY, tileSizeInPixels, tileSizeInPixels);
        continue;
      }

      const tileCharacter = map.rows[mapY][mapX];
      context.fillStyle = tileColorFor(tileCharacter);
      context.fillRect(pixelX, pixelY, tileSizeInPixels, tileSizeInPixels);
      drawTileDetail(tileCharacter, pixelX, pixelY);
    }
  }
}

// A little extra shape on some tiles so a tree isn't just a green square.
// Pure decoration: delete this function's body and the game still works.
function drawTileDetail(tileCharacter, pixelX, pixelY) {
  const half = tileSizeInPixels / 2;
  if (tileCharacter === 'T') {
    context.fillStyle = colors.treeTop;
    context.beginPath();
    context.arc(pixelX + half, pixelY + half, half * 0.6, 0, Math.PI * 2);
    context.fill();
  }
  if (tileCharacter === 'D' || tileCharacter === 'X') {
    context.fillStyle = colors.doorInner;
    context.fillRect(pixelX + 8, pixelY + 6, tileSizeInPixels - 16, tileSizeInPixels - 6);
  }
}

// Items are small squares. An item is skipped if it is on another map or
// has already been picked up.
function drawItems(camera) {
  for (const item of items) {
    if (item.map !== state.currentMap) continue;
    if (state.pickedUpItems[item.id]) continue;
    const pixelX = (item.tileX - camera.tileX) * tileSizeInPixels;
    const pixelY = (item.tileY - camera.tileY) * tileSizeInPixels;
    context.fillStyle = item.color;
    context.fillRect(pixelX + 9, pixelY + 9, tileSizeInPixels - 18, tileSizeInPixels - 18);
  }
}

// NPCs are colored squares with their name floating above.
function drawNpcs(camera) {
  for (const npc of npcs) {
    if (npc.map !== state.currentMap) continue;
    const pixelX = (npc.tileX - camera.tileX) * tileSizeInPixels;
    const pixelY = (npc.tileY - camera.tileY) * tileSizeInPixels;
    context.fillStyle = npc.color;
    context.fillRect(pixelX + 4, pixelY + 4, tileSizeInPixels - 8, tileSizeInPixels - 8);
    context.fillStyle = colors.hudText;
    context.font = fonts.small;
    context.textAlign = 'center';
    context.fillText(npc.name, pixelX + tileSizeInPixels / 2, pixelY - 3);
  }
}

// The player is a square with an "eye" on the side they are facing, so you
// can see which tile Space will talk to.
function drawPlayer(camera) {
  const player = state.player;
  const pixelX = (player.tileX - camera.tileX) * tileSizeInPixels;
  const pixelY = (player.tileY - camera.tileY) * tileSizeInPixels;
  context.fillStyle = colors.player;
  context.fillRect(pixelX + 4, pixelY + 4, tileSizeInPixels - 8, tileSizeInPixels - 8);

  const offset = directionOffsets[player.facing];
  const eyeX = pixelX + tileSizeInPixels / 2 + offset.dx * 9 - 3;
  const eyeY = pixelY + tileSizeInPixels / 2 + offset.dy * 9 - 3;
  context.fillStyle = colors.playerEye;
  context.fillRect(eyeX, eyeY, 6, 6);
}

// The panel under the world: where you are, what you carry, and the quests.
function drawHud() {
  const top = viewportHeightInTiles * tileSizeInPixels;
  context.fillStyle = colors.hudBackground;
  context.fillRect(0, top, canvas.width, hudHeightInPixels);
  context.textAlign = 'left';
  context.font = fonts.hud;

  context.fillStyle = colors.hudText;
  context.fillText('Place: ' + maps[state.currentMap].title, 12, top + 24);

  let bagText = '(empty)';
  if (state.inventory.length > 0) {
    const names = [];
    for (const itemId of state.inventory) {
      names.push(findItemById(itemId).name);
    }
    bagText = names.join(', ');
  }
  context.fillText('Bag: ' + bagText, 12, top + 48);

  context.fillStyle = colors.hudDim;
  context.font = fonts.small;
  context.fillText('Arrows/WASD move · Space talk · K save · L load · N new game', 12, top + 82);

  context.font = fonts.hud;
  for (let index = 0; index < quests.length; index++) {
    const quest = quests[index];
    let mark = '[ ] ';
    context.fillStyle = colors.hudDim;
    if (state.flags[quest.flag]) {
      mark = '[x] ';
      context.fillStyle = colors.questDone;
    }
    context.fillText(mark + quest.title, 380, top + 24 + index * 24);
  }
}

// The speech box sits over the bottom of the world while someone talks.
function drawDialogueBox() {
  const npc = findNpcById(state.dialogue.npcId);
  const node = npc.dialogue[state.dialogue.nodeKey];
  const boxHeight = 60 + (node.lines.length + node.choices.length) * 22;
  const boxTop = viewportHeightInTiles * tileSizeInPixels - boxHeight - 8;
  context.fillStyle = colors.dialogueBox;
  context.fillRect(8, boxTop, canvas.width - 16, boxHeight);
  context.textAlign = 'left';

  context.font = fonts.dialogue;
  context.fillStyle = colors.dialogueName;
  context.fillText(npc.name, 24, boxTop + 26);

  context.fillStyle = colors.dialogueText;
  for (let index = 0; index < node.lines.length; index++) {
    context.fillText(node.lines[index], 24, boxTop + 52 + index * 22);
  }

  const choicesTop = boxTop + 52 + node.lines.length * 22;
  if (node.choices.length === 0) {
    context.fillStyle = colors.dialogueChoice;
    context.fillText('(Space to continue)', 24, choicesTop);
    return;
  }
  for (let index = 0; index < node.choices.length; index++) {
    let marker = '   ';
    context.fillStyle = colors.dialogueChoice;
    if (index === state.dialogue.choiceIndex) {
      marker = ' > ';
      context.fillStyle = colors.dialogueChoiceSelected;
    }
    context.fillText(marker + node.choices[index].label, 24, choicesTop + index * 22);
  }
}

// The yellow banner for "Saved!" and pickups. Nothing is drawn once the
// timer that UPDATE counts down reaches zero.
function drawNotice() {
  if (state.notice.secondsLeft <= 0) return;
  context.font = fonts.notice;
  context.textAlign = 'center';
  context.fillStyle = colors.dialogueBox;
  context.fillRect(canvas.width / 2 - 180, 10, 360, 34);
  context.fillStyle = colors.notice;
  context.fillText(state.notice.text, canvas.width / 2, 34);
}

// THE PROMISE, ENFORCED. LOOP takes a text snapshot of `state` before
// render() and hands it here afterwards. If drawing changed anything, the
// two strings differ and the game halts with an error naming the crime.
function assertRenderChangedNothing(stateBeforeRender) {
  if (!checkRenderPurity) return;
  const stateAfterRender = JSON.stringify(state);
  if (stateAfterRender !== stateBeforeRender) {
    throw new Error('RENDER changed state! Drawing must only read.');
  }
}


/* ============================================================
   8 · LOOP — the heartbeat
   What to look for: the browser calls `frame` about sixty times a
   second. Each call catches the simulation up in fixed steps, then
   draws once. This is the most important dozen lines in the file.
   ============================================================ */

// The loop's stopwatch. Not game state: never saved, never drawn.
let lastFrameTimeInMs = 0;
let unsimulatedSeconds = 0;

function frame(nowInMs) {
  let elapsedSeconds = (nowInMs - lastFrameTimeInMs) / 1000;
  if (elapsedSeconds > maxFrameGapInSeconds) elapsedSeconds = maxFrameGapInSeconds;
  lastFrameTimeInMs = nowInMs;
  unsimulatedSeconds += elapsedSeconds;
  while (unsimulatedSeconds >= fixedStepInSeconds) {
    update(fixedStepInSeconds);
    unsimulatedSeconds -= fixedStepInSeconds;
  }
  const stateBeforeRender = JSON.stringify(state);
  render();
  assertRenderChangedNothing(stateBeforeRender);
  requestAnimationFrame(frame);
}


/* ============================================================
   9 · SAVE — remembering between visits
   What to look for: the whole save is `state` turned into text and
   stored in the browser. Loading is the reverse. Both are wrapped
   in try/catch because storage can be missing or full.
   ============================================================ */


/* ============================================================
   10 · BOOT — wire it up and start
   What to look for: this is where the program begins. It sizes
   the canvas, listens for keys, tries to load a save, and asks
   the browser for the first frame. Everything after that is LOOP.
   ============================================================ */

canvas.width = viewportWidthInTiles * tileSizeInPixels;
canvas.height = viewportHeightInTiles * tileSizeInPixels + hudHeightInPixels;

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);

requestAnimationFrame(frame);

</script>
</body>
</html>
